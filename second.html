<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>お薦めな旅行先を紹介</title>
  </head>
  <body>
      <img src="https://thumb.photo-ac.com/ee/ee6ac9604877da9834a71b2e9d6eb0d7_w.jpeg" width="300" height="200" alt="奈良公園">
      <h1>お薦めな旅行先</h1>
        <h2>奈良</h2>
        <p>奈良には歴史的に価値のある建物があり、多くのシカがいる奈良公園もあるのでおすすめです。</p>
      <a href = "../index.html">to index</a>
    <h2>BMI指標計算</h2>
<form oninput="bmi.value = Math.round(Number(weight.value) / Math.pow(Number(height.value)/100, 2) * 10) / 10">
    <p><label>体重(kg)：<input name="weight" type="number" step="any"></label></p>
    <p><label>身長(cm)：<input name="height" type="number" step="any"></label></p>
    <p><label>BMI：<output name="bmi"></output></label></p>
</form>
  </body>
</html>
